# Tests the app on Windows and builds the Windows installer.
# The installer is attached to each run as the artifact "CommunicationAid-Windows-Setup"
# (Actions tab > this workflow > a run > Artifacts).
name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Version number for the installer
        default: 0.1.0

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"  # tobii-research only ships wheels for 3.10
          cache: pip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-tobii.txt -r requirements-translate.txt -r requirements-build.txt pytest

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -rs -s

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build the installer
        run: |
          $version = if ("${{ github.event.inputs.version }}") { "${{ github.event.inputs.version }}" } else { "0.1.0" }
          powershell -ExecutionPolicy Bypass -File packaging\windows\build_windows.ps1 -Version $version

      - name: Check the packaged app starts
        run: |
          $p = Start-Process -FilePath "dist\Communication Aid\Communication Aid.exe" -ArgumentList "--check-tracker" -PassThru
          # A crash would sit behind an error dialog, so don't wait for ever.
          if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Error "The app did not finish (error dialog?)" }
          Write-Host "check-tracker exit code $($p.ExitCode) (1 = no tracker, expected here)"
          if ($p.ExitCode -notin 0, 1) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: CommunicationAid-Windows-Setup
          path: dist/CommunicationAid-*-Windows-Setup.exe
          retention-days: 30
          compression-level: 0
